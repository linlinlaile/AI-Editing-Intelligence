[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aei"
version = "0.1.0"
description = "AI Editing Intelligence semantic timeline"
requires-python = ">=3.10,<3.13"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]
media = ["av>=12,<15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra"]
